name: zipro_mobile
description: Zipro mobile client — Flutter app mirroring zipro_website_new flows.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  mime: ^2.0.0
  razorpay_flutter: ^1.3.7
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/images/mobilebk.png
    - assets/images/login2.png
    - assets/images/login3.png
